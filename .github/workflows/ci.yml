name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: paycore
          POSTGRES_PASSWORD: password
          POSTGRES_DB: paycore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Unit tests
      run: npm test

    - name: Type check
      run: npm run typecheck
      # Ensure there are no type errors in the repository

    - name: Run Database Migrations
      run: npm run db:migrate
      env:
        DATABASE_URL: postgres://paycore:password@localhost:5432/paycore_test?sslmode=disable

    - name: Run Integration Tests
      run: npm run test:integration -- --fileParallelism false
      env:
        TEST_DATABASE_URL: postgres://paycore:password@localhost:5432/paycore_test?sslmode=disable
        DATABASE_URL: postgres://paycore:password@localhost:5432/paycore_test?sslmode=disable
        REDIS_URL: redis://localhost:6379
        API_KEY: test-api-key
